<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pentagon Fractal</title>
    <style>
        :root { --line: rgb(255, 0, 0); }

        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            font-family: "Courier New", monospace;
        }
        canvas {
            display: block;
            background-color: #000;
            cursor: crosshair;
            touch-action: none;
        }
        canvas.dragging { cursor: move; }

        #dragBox {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 12px;
            background: #000;
            border: 1px solid var(--line);
            color: var(--line);
            cursor: move;
            user-select: none;
            font-size: 13px;
        }
        #dragBox strong { font-weight: normal; letter-spacing: 1px; text-transform: uppercase; }
        #dragBox input {
            width: 60px;
            box-sizing: border-box;
            margin-left: 6px;
            background: #000;
            color: var(--line);
            border: 1px solid var(--line);
            font: inherit;
            padding: 2px 4px;
            outline: none;
        }
        #dragBox button {
            margin-top: 8px;
            width: 100%;
            background: #000;
            color: var(--line);
            border: 1px solid var(--line);
            font: inherit;
            padding: 3px 0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #dragBox button:hover { background: var(--line); color: #000; }
        #info {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--line);
            font-size: 12px;
        }
        #hint {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--line);
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <canvas id="fractalCanvas"></canvas>

    <div id="dragBox">
        <strong>Sides:</strong>
        <input type="number" id="sidesInput" value="10" min="3" max="50">
        <button id="resetBtn">Reset view</button>
        <div id="info"></div>
        <div id="hint">Scroll: zoom<br>Drag: pan<br>Double-click: reset</div>
    </div>

    <script>
        const canvas = document.getElementById('fractalCanvas');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('sidesInput');
        const info = document.getElementById('info');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            dirty = true;
        }

        const RATIO = 1 - 0.618;
        const R = 250;

        let sides = 10;
        let vertices = [];

        function build() {
            sides = Math.max(3, Math.min(50, parseInt(input.value) || 10));
            vertices = [];
            for (let i = 0; i < sides; i++) {
                const a = (i * 2 * Math.PI) / sides - Math.PI / 2;
                vertices.push({ x: R * Math.cos(a), y: R * Math.sin(a) });
            }
            dirty = true;
        }

        //code for zooming and panning
        let view, zoom;
        function resetView() { view = { x: 0, y: 0 }; zoom = 1; dirty = true; }

        //code to keeping rendering for zoom and pan
        function intersects(n) {
            const sx = (n.x - view.x) * zoom + W / 2;
            const sy = (n.y - view.y) * zoom + H / 2;
            const sr = n.s * R * zoom;
            return sx + sr >= 0 && sx - sr <= W && sy + sr >= 0 && sy - sr <= H;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            const maxLevel = Math.max(200, Math.floor(60000 / sides));

            let level = [{ x: 0, y: 0, s: 1 }];
            for (let depth = 0; depth < 2000; depth++) {
                if (level[0].s * R * zoom < 3) break; 
                const next = [];
                for (const n of level) {
                    for (const v of vertices) {
                        const child = {
                            x: n.x + n.s * 0.618 * v.x,
                            y: n.y + n.s * 0.618 * v.y,
                            s: n.s * RATIO
                        };
                        if (intersects(child)) next.push(child);
                    }
                }
                if (next.length === 0 || next.length > maxLevel) break;
                level = next;
            }

            ctx.strokeStyle = 'rgb(255, 0, 0)';
            ctx.lineWidth = 1;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (const n of level) {
                for (let i = 0; i < sides; i++) {
                    const v = vertices[i];
                    const sx = (n.x + n.s * v.x - view.x) * zoom + W / 2;
                    const sy = (n.y + n.s * v.y - view.y) * zoom + H / 2;
                    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                }
            }
            ctx.stroke();

            info.textContent = 'ZOOM ' + (zoom < 1e6 ? zoom.toFixed(2) : zoom.toExponential(2)) + 'x';
        }

        let dirty = true;
        function loop() {
            if (dirty) { dirty = false; draw(); }
            requestAnimationFrame(loop);
        }

        // Human interaction :)
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const f = Math.exp(-e.deltaY * 0.0015);
            const mx = e.clientX - W / 2, my = e.clientY - H / 2;
            const wx = view.x + mx / zoom, wy = view.y + my / zoom;
            zoom *= f;
            view.x = wx - mx / zoom;
            view.y = wy - my / zoom;
            dirty = true;
        }, { passive: false });

        let panning = false, lx, ly;
        canvas.addEventListener('pointerdown', e => {
            panning = true; lx = e.clientX; ly = e.clientY;
            canvas.classList.add('dragging');
            canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointermove', e => {
            if (!panning) return;
            view.x -= (e.clientX - lx) / zoom;
            view.y -= (e.clientY - ly) / zoom;
            lx = e.clientX; ly = e.clientY;
            dirty = true;
        });
        const stopPan = () => { panning = false; canvas.classList.remove('dragging'); };
        canvas.addEventListener('pointerup', stopPan);
        canvas.addEventListener('pointercancel', stopPan);
        canvas.addEventListener('dblclick', resetView);
        document.getElementById('resetBtn').addEventListener('click', resetView);

        input.addEventListener('input', build);
        window.addEventListener('resize', resize);

        //Drag the box
        const box = document.getElementById('dragBox');
        let dragging = false, ox, oy;
        box.addEventListener('mousedown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            dragging = true;
            ox = e.clientX - box.offsetLeft;
            oy = e.clientY - box.offsetTop;
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            box.style.left = (e.clientX - ox) + 'px';
            box.style.top = (e.clientY - oy) + 'px';
        });
        document.addEventListener('mouseup', () => dragging = false);

        resetView();
        build();
        resize();
        loop();
    </script>
</body>
</html>
