<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Infinite 3D Polygon Fractal</title>
    <style>
        :root { --line: rgb(255, 0, 0); }

        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            cursor: grab;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }

        #dragBox {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--line);
            color: var(--line);
            cursor: move;
            user-select: none;
            font-size: 13px;
            z-index: 10;
        }
        #dragBox strong { font-weight: normal; letter-spacing: 1px; text-transform: uppercase; }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        #dragBox input {
            width: 60px;
            box-sizing: border-box;
            margin-left: 6px;
            background: #000;
            color: var(--line);
            border: 1px solid var(--line);
            font: inherit;
            padding: 2px 4px;
            outline: none;
        }
        #dragBox button {
            margin-top: 8px;
            width: 100%;
            background: #000;
            color: var(--line);
            border: 1px solid var(--line);
            font: inherit;
            padding: 3px 0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #dragBox button:hover { background: var(--line); color: #000; }
        #info {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--line);
            font-size: 12px;
            line-height: 1.4;
        }
        #hint {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--line);
            font-size: 11px;
            opacity: 0.7;
            line-height: 1.4;
        }
    </style>
    <script type= "importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id='dragBox'>
        <div class='row'>
            <strong>Sides:</strong>
            <input type='number' id='sidesInput' value='5' min='3' max='20'>
        </div>
        <div class='row'>
            <strong>3D height:</strong>
            <input type='number' id='heightInput' value='80' min='0' max='300' step='10'>
        </div>
        <button id='resetBtn'>Reset view</button>
        <div id='info'>ZOOM: 1.00x<br>3D PRISMS: 0</div>
        <div id='hint'>Left-drag: rotate 3D<br>Right-drag: pan<br>Scroll: infinite zoom<br>Double-click: reset</div>
    </div>

    <script type='module'>
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 50000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 0.0001;
        controls.zoomSpeed = 1.2;

        const ambientLight = new THREE.AmbientLight(0x330000, 1.5);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xff2222, 2.5);
        dirLight1.position.set(300, 400, 500);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x880000, 1.2);
        dirLight2.position.set(-400, -300, -200);
        scene.add(dirLight2);

        const RATIO = 1 - 0.618;
        const R = 250;
        const INITIAL_CAM_DIST = 790;

        const sidesInput = document.getElementById('sidesInput');
        const heightInput = document.getElementById('heightInput');
        const info = document.getElementById('info');

        let fractalGroup = new THREE.Group();
        scene.add(fractalGroup);

        const solidMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a0000,
            emissive: 0x220000,
            roughness: 0.4,
            metalness: 0.5,
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1,
            side: THREE.DoubleSide
        });

        const edgeMaterial = new THREE.LineBasicMaterial({
            color: 0xff0000
        });

        let currentSides = 0;
        let baseVertices = [];
        let extrudeGeo = null;
        let edgesGeo = null;

        function updateBaseGeometry(sides) {
            if (sides === currentSides && extrudeGeo) return;
            currentSides = sides;

            if (extrudeGeo) extrudeGeo.dispose();
            if (edgesGeo) edgesGeo.dispose();

            baseVertices = [];
            const shape = new THREE.Shape();
            for (let i = 0; i < sides; i++) {
                const a = (i * 2 * Math.PI) / sides - Math.PI / 2;
                const x = R * Math.cos(a);
                const y = R * Math.sin(a);
                baseVertices.push({ x, y });
                if (i === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }
            shape.closePath();

            const baseThickness = 40;
            extrudeGeo = new THREE.ExtrudeGeometry(shape, { depth: baseThickness, bevelEnabled: false });
            extrudeGeo.translate(0, 0, -baseThickness / 2);
            edgesGeo = new THREE.EdgesGeometry(extrudeGeo);
        }

        const frustum = new THREE.Frustum();
        const projScreenMatrix = new THREE.Matrix4();
        const boundingSphere = new THREE.Sphere();
        const nodeCenter = new THREE.Vector3();

        function rebuildVisibleFractal() {
            while (fractalGroup.children.length > 0) {
                const child = fractalGroup.children[0];
                fractalGroup.remove(child);
                if (child.isInstancedMesh) child.dispose();
                else if (child.geometry) child.geometry.dispose();
            }
            const sides = Math.max(3, Math.min(20, parseInt(sidesInput.value) || 5));
            const height = parseFloat(heightInput.value) || 0;
            updateBaseGeometry(sides);

            camera.updateMatrixWorld();
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);

            const fovFactor = 1 / Math.tan((camera.fov * Math.PI) / 360);
            const screenH = window.innerHeight;
            const maxVisiblePrisms = Math.max(400, Math.floor(24000 / sides));

            let queue = [{ x: 0, y: 0, z: 0, s: 1 }];
            const renderList = [];
            let maxDepthReached = 0;

            while (queue.length > 0 && renderList.length + queue.length < maxVisiblePrisms) {
                const nextQueue = [];
                maxDepthReached++;
                if (maxDepthReached > 60) break;

                for (const n of queue) {
                    nodeCenter.set(n.x, n.y, n.z);
                    const worldRadius = n.s * R * 1.15;
                    boundingSphere.set(nodeCenter, worldRadius);

                    if (!frustum.intersectsSphere(boundingSphere)) {
                        continue;
                    }

                    const dist = Math.max(0.00001, camera.position.distanceTo(nodeCenter));
                    const pixelRadius = (worldRadius / dist) * fovFactor * (screenH * 0.5);

                    if (pixelRadius < 28) {
                        renderList.push(n);
                    } else {
                        for (const v of baseVertices) {
                            nextQueue.push({
                                x: n.x + n.s * 0.618 * v.x,
                                y: n.y + n.s * 0.618 * v.y,
                                z: n.z + n.s * height,
                                s: n.s * RATIO
                            });
                        }
                    }
                }

                if (renderList.length + nextQueue.length > maxVisiblePrisms) {
                    renderList.push(...nextQueue);
                    break;
                }
                queue = nextQueue;
            }

            if (renderList.length === 0 && queue.length > 0) {
                renderList.push(...queue);
            }

            const count = renderList.length;
            if (count === 0) return;

            const instancedMesh = new THREE.InstancedMesh(extrudeGeo, solidMaterial, count);
            const dummy = new THREE.Object3D();

            const linePositions = [];
            const baseEdgePos = edgesGeo.attributes.position.array;

            for (let i = 0; i < count; i++) {
                const n = renderList[i];
                dummy.position.set(n.x, n.y, n.z);
                dummy.scale.set(n.s, n.s, n.s);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);

                for (let j = 0; j < baseEdgePos.length; j += 3) {
                    linePositions.push(
                        baseEdgePos[j] * n.s + n.x,
                        baseEdgePos[j + 1] * n.s + n.y,
                        baseEdgePos[j + 2] * n.s + n.z
                    );
                }
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            fractalGroup.add(instancedMesh);

            const mergedEdgesGeo = new THREE.BufferGeometry();
            mergedEdgesGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            const wireLines = new THREE.LineSegments(mergedEdgesGeo, edgeMaterial);
            fractalGroup.add(wireLines);

            const camDist = camera.position.distanceTo(controls.target);
            const zoomLevel = INITIAL_CAM_DIST / Math.max(1e-12, camDist);
            const zoomStr = zoomLevel < 1e5 ? zoomLevel.toFixed(2) : zoomLevel.toExponential(2);
            info.innerHTML = 'ZOOM: ' + zoomStr + 'x<br>3D Prisms: ' + count.toLocaleString();
        }

        function resetView() {
            camera.position.set(0, -450, 650);
            controls.target.set(0, 0, 40);
            controls.update();
            dirty = true;
        }

        let dirty = true;
        controls.addEventListener('change', () => {
            const dist = camera.position.distanceTo(controls.target);
            controls.panSpeed = Math.min(1.5, Math.max(0.05, dist / 500));
            dirty = true;
        });

        sidesInput.addEventListener('input', () => { dirty = true; });
        heightInput.addEventListener('input', () => { dirty = true; });
        document.getElementById('resetBtn').addEventListener('click', resetView);
        renderer.domElement.addEventListener('dblclick', resetView);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            dirty = true;
        });

        const box = document.getElementById('dragBox');
        let dragging = false, ox, oy;
        box.addEventListener('mousedown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            dragging = true;
            ox = e.clientX - box.offsetLeft;
            oy = e.clientY - box.offsetTop;
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            box.style.left = (e.clientX - ox) + 'px';
            box.style.top = (e.clientY - oy) + 'px';
        });
        document.addEventListener('mouseup', () => dragging = false);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (dirty) {
                dirty = false;
                rebuildVisibleFractal();
            }
            renderer.render(scene, camera);
        }

        resetView();
        animate();
    </script>
</body>
</html>
